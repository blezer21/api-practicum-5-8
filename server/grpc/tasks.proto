// Практическая работа №8, вариант 3 — сервис списка личных задач на день.
// CRUD: CreateTask, GetTask / ListTasks (read), UpdateTask, DeleteTask.
syntax = "proto3";

package planner;

service TaskService {
  rpc ListTasks (ListTasksRequest) returns (TaskList);
  rpc GetTask (TaskId) returns (Task);
  rpc CreateTask (CreateTaskRequest) returns (Task);
  rpc UpdateTask (UpdateTaskRequest) returns (Task);
  rpc DeleteTask (TaskId) returns (DeleteTaskReply);
  // Дополнительно: сводка по дню (сколько задач и сколько выполнено).
  rpc GetDayStats (DayRequest) returns (DayStats);
}

enum Priority {
  MEDIUM = 0;
  LOW = 1;
  HIGH = 2;
}

message Task {
  string id = 1;
  string title = 2;
  string description = 3;
  string date = 4;        // ГГГГ-ММ-ДД
  string time = 5;        // ЧЧ:ММ, может быть пустым
  Priority priority = 6;
  bool done = 7;
  string created_at = 8;
}

message TaskId {
  string id = 1;
}

message ListTasksRequest {
  string date = 1;        // пусто — все дни
  bool only_pending = 2;  // только невыполненные
}

message TaskList {
  repeated Task tasks = 1;
}

message CreateTaskRequest {
  string title = 1;
  string description = 2;
  string date = 3;
  string time = 4;
  Priority priority = 5;
}

// optional позволяет отличить «поле не передано» от значения по умолчанию
// (например, done = false при снятии отметки).
message UpdateTaskRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string date = 4;
  optional string time = 5;
  optional Priority priority = 6;
  optional bool done = 7;
}

message DeleteTaskReply {
  bool deleted = 1;
}

message DayRequest {
  string date = 1;
}

message DayStats {
  string date = 1;
  int32 total = 2;
  int32 done = 3;
}
