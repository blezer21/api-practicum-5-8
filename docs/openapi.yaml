openapi: 3.0.3
info:
  title: GameStore API
  version: 1.0.0
  description: |
    Практическая работа №6 — интерфейс прикладного программирования магазина
    компьютерных игр, спроектированный по спецификации **OpenAPI 3.0**.

    * документация — ReDoc (`/docs`) и Swagger UI (`/swagger`);
    * имитационный сервер — Prism: `npm run mock` → `http://127.0.0.1:4010`;
    * настоящая реализация — Node.js / Express на основном сервере.

    Дополнительно описан REST API телефонного справочника из практической работы №5.
  contact:
    name: Практикум «Интерфейсы прикладного программирования»
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Основной сервер (Express)
  - url: http://127.0.0.1:4010
    description: Prism mock-сервер
tags:
  - name: Games
    description: Каталог игр — №6
  - name: Orders
    description: Покупка игр — №6
  - name: Contacts
    description: Телефонный справочник — №5

paths:
  /api/games:
    get:
      tags: [Games]
      operationId: listGames
      summary: Список игр
      description: Возвращает каталог. Все фильтры необязательны и комбинируются.
      parameters:
        - name: genre
          in: query
          schema: { $ref: '#/components/schemas/Genre' }
        - name: platform
          in: query
          schema: { $ref: '#/components/schemas/Platform' }
        - name: maxPrice
          in: query
          description: Максимальная цена, ₽
          schema: { type: number, minimum: 0, example: 2000 }
        - name: search
          in: query
          description: Поиск по названию
          schema: { type: string, example: тени }
      responses:
        '200':
          description: Массив игр
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Games]
      operationId: createGame
      summary: Добавить игру
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameInput' }
      responses:
        '201':
          description: Игра создана
          headers:
            Location:
              description: Адрес созданного ресурса
              schema: { type: string, example: /api/games/0b9b7d2e-5c1a-4a8e-9f61-3f7c1d1e2a10 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/games/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Games]
      operationId: getGame
      summary: Получить игру
      responses:
        '200':
          description: Игра
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Games]
      operationId: replaceGame
      summary: Полностью обновить игру
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameInput' }
      responses:
        '200':
          description: Обновлённая игра
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Games]
      operationId: deleteGame
      summary: Удалить игру
      responses:
        '204': { description: 'Удалено, тела ответа нет' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/games/{id}/orders:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Orders]
      operationId: buyGame
      summary: Купить игру
      description: Уменьшает остаток на складе и возвращает чек заказа.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              additionalProperties: false
              properties:
                quantity: { type: integer, minimum: 1, maximum: 100, example: 1 }
      responses:
        '201':
          description: Заказ оформлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Недостаточно товара на складе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: На складе только 0 шт. }

  /api/contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: Список контактов
      parameters:
        - name: search
          in: query
          description: Поиск по имени, почте и телефонам
          schema: { type: string }
      responses:
        '200':
          description: Массив контактов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
    post:
      tags: [Contacts]
      operationId: createContact
      summary: Создать контакт
      description: Обязательно имя и хотя бы один телефон.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactInput' }
      responses:
        '201':
          description: Контакт создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Contacts]
      operationId: getContact
      summary: Получить контакт
      responses:
        '200':
          description: Контакт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Contacts]
      operationId: replaceContact
      summary: Полностью обновить контакт
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactInput' }
      responses:
        '200':
          description: Обновлённый контакт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Contacts]
      operationId: patchContact
      summary: Частично обновить контакт
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactPatch' }
      responses:
        '200':
          description: Обновлённый контакт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Contacts]
      operationId: deleteContact
      summary: Удалить контакт
      responses:
        '204': { description: 'Удалено, тела ответа нет' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Идентификатор (UUID)
      schema: { type: string, format: uuid, example: 0b9b7d2e-5c1a-4a8e-9f61-3f7c1d1e2a10 }

  responses:
    BadRequest:
      description: Ошибка валидации входных данных
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Поле «Название» обязательно }
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Игра не найдена }

  schemas:
    Genre:
      type: string
      enum: [action, rpg, strategy, simulator, puzzle, racing, sport, indie]
      example: rpg
    Platform:
      type: string
      enum: [pc, playstation, xbox, switch, mobile]
      example: pc

    GameInput:
      type: object
      required: [title, genre, platforms, price]
      properties:
        title: { type: string, maxLength: 120, example: Тени севера }
        genre: { $ref: '#/components/schemas/Genre' }
        platforms:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Platform' }
          example: [pc, playstation]
        price: { type: number, minimum: 0, maximum: 100000, description: 'Цена, ₽', example: 2999 }
        stock: { type: integer, minimum: 0, description: Остаток на складе, example: 6 }
        releaseYear: { type: integer, minimum: 1970, maximum: 2100, example: 2025 }
        rating: { type: number, minimum: 0, maximum: 10, example: 9.1 }
        description: { type: string, maxLength: 1000, example: Ролевая игра в открытом мире. }

    Game:
      allOf:
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid, readOnly: true, example: 0b9b7d2e-5c1a-4a8e-9f61-3f7c1d1e2a10 }
            createdAt: { type: string, format: date-time, readOnly: true, example: '2026-11-23T10:00:00.000Z' }
        - $ref: '#/components/schemas/GameInput'

    Order:
      type: object
      required: [orderId, gameId, title, quantity, total, stockLeft]
      properties:
        orderId: { type: string, format: uuid, example: 7c3f0a8e-1d2b-4c5e-8f9a-0b1c2d3e4f50 }
        gameId: { type: string, format: uuid, example: 0b9b7d2e-5c1a-4a8e-9f61-3f7c1d1e2a10 }
        title: { type: string, example: Тени севера }
        quantity: { type: integer, example: 1 }
        total: { type: number, description: 'Сумма заказа, ₽', example: 2999 }
        stockLeft: { type: integer, example: 5 }

    ContactInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100, example: Иван Петров }
        email: { type: string, format: email, example: ivan@example.com }
        mobile: { type: string, description: Мобильный телефон, example: +7 900 111-22-33 }
        home: { type: string, description: Домашний телефон, example: '' }
        note: { type: string, maxLength: 300, example: Одногруппник }

    ContactPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string }
        mobile: { type: string }
        home: { type: string }
        note: { type: string }

    Contact:
      allOf:
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid, readOnly: true, example: 3f2b8c1a-9d4e-4f6a-8b7c-1e2d3c4b5a69 }
            createdAt: { type: string, format: date-time, readOnly: true, example: '2026-11-23T10:00:00.000Z' }
        - $ref: '#/components/schemas/ContactInput'

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: Описание ошибки }
